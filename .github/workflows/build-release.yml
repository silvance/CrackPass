name: Publish Windows binary

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up MSYS2 with UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: |
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-python
            zip

      - name: Build
        shell: msys2 {0}
        run: |
          cmake -B build
          cmake --build build

      - name: Copy executable and dependencies
        shell: msys2 {0}
        run: |
          mkdir "casekey-${{ github.ref_name }}"
          mkdir "casekey-${{ github.ref_name }}/docs"
          # copy binary
          cp build/casekey.exe "casekey-${{ github.ref_name }}/"
          # copy docs
          cp README.md CHANGELOG.md FAQ.md LICENSE "casekey-${{ github.ref_name }}/docs/"
          # bundle needed libraries
          cd "casekey-${{ github.ref_name }}/"
          ldd casekey.exe | grep /ucrt64 | awk '{print $3}' | xargs -i cp {} .
          # Run Qt's windows deployment tool
          windeployqt6.exe casekey.exe \
            --release \
            --no-libraries \
            --no-translations \
            --no-quick-import \
            --no-system-d3d-compiler \
            --no-system-dxc-compiler \
            --no-compiler-runtime \
            --no-opengl-sw \
            --no-ffmpeg

      - name: Provision approved wordlists (optional)
        shell: msys2 {0}
        run: |
          # RELEASE-TIME PROVISIONING HOOK. Repository policy keeps password data
          # out of source control, so the built-in wordlist FILES are not in the
          # checkout -- only the manifest that declares them. A maintainer who
          # ships the approved, appropriately licensed lists wires their retrieval
          # in here (e.g. fetch from a secure internal store) so the files land at
          #   resources/dictionaries/casekey-common.txt
          #   resources/dictionaries/casekey-quick.txt
          # By default this is a no-op: the release ships the manifest only and
          # CaseKey shows each entry as "file not supplied" (it never fabricates
          # candidates). See resources/dictionaries/README.md.
          echo "No release-time wordlist provisioning configured; shipping manifest only."

      - name: Bundle managed dictionaries
        shell: msys2 {0}
        run: |
          # Package the dictionaries directory next to the binary, matching the
          # runtime search path (<appDir>/dictionaries/manifest.json). The manifest
          # (and README) are always included; any provisioned .txt files are too.
          dest="casekey-${{ github.ref_name }}/dictionaries"
          mkdir -p "$dest"
          cp resources/dictionaries/manifest.json "$dest/"
          cp resources/dictionaries/README.md "$dest/"
          cp resources/dictionaries/*.txt "$dest/" 2>/dev/null || true
          # Fail the release if any dictionary declared "required" was not
          # provisioned, rather than shipping a built-in that is promised but absent.
          python tools/check_release_dictionaries.py "$dest"

      - name: Zip release artifacts
        shell: msys2 {0}
        run: |
          zip -r "casekey-${{ github.ref_name }}-windows-x64.zip" "casekey-${{ github.ref_name }}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: "casekey-${{ github.ref_name }}-windows-x64.zip"
